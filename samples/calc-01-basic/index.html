<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CALC 01 Basic</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../assets/sample-common.css" />
  </head>
  <body>
    <a class="top-link" href="../../index.html">Top</a>
    <header><h1>Basic Calc</h1></header>
    <section>
      <div class="wrap">
        <a class="back" href="../../index.html">Back</a>
        <h2>基本計算</h2>
        <p>2つの数値を四則演算します。</p>
      </div>
    </section>
    <section class="demo">
      <div class="wrap panel">
        <div class="form">
          <input id="a" type="number" value="12" /><select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">×</option>
            <option value="/">÷</option></select
          ><input id="b" type="number" value="3" /><button id="calculate">
            計算
          </button>
        </div>
        <p class="calc-result" id="result">15</p>
      </div>
    </section>
    <section data-code-viewer></section>
    <footer>
      <a href="https://github.com/k4nkan/web-js-samples">GitHub</a>
    </footer>
    <script src="./script.js"></script>
    <script src="../../assets/copy-code.js"></script>
  </body>
</html>
