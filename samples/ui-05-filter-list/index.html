<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI 05 Filter List</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../assets/sample-common.css" />
  </head>
  <body>
    <a class="top-link" href="../../index.html">Top</a>
    <header><h1>Filter List</h1></header>
    <section>
      <div class="wrap">
        <a class="back" href="../../index.html">Back</a>
        <h2>リスト絞り込み</h2>
        <p>入力された文字を含む項目だけ表示します。</p>
      </div>
    </section>
    <section class="demo">
      <div class="wrap panel">
        <input id="keyword" placeholder="例: croissant" />
        <div class="result">
          <div class="list-item" data-name="croissant">croissant</div>
          <div class="list-item" data-name="danish">danish</div>
          <div class="list-item" data-name="bagel">bagel</div>
          <div class="list-item" data-name="rye bread">rye bread</div>
        </div>
      </div>
    </section>
    <section data-code-viewer></section>
    <footer>
      <a href="https://github.com/k4nkan/web-js-samples">GitHub</a>
    </footer>
    <script src="./script.js"></script>
    <script src="../../assets/copy-code.js"></script>
  </body>
</html>
