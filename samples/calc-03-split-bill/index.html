<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="./style.css" />

  <body>
    <a class="top-link" href="../../index.html">Top</a>

        <p>合計金額、人数、丸め単位から1人あたりの金額を出します。</p>
