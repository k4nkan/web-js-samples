<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CALC 12 Quiz</title>
    <link rel="icon" href="../../assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../assets/sample-common.css" />
  </head>
  <body>
    <a class="top-link" href="../../index.html">Top</a>
    <header><h1>Quiz</h1></header>
    <section>
      <div class="wrap">
        <a class="back" href="../../index.html">Back</a>
        <h2>クイズの正誤判定</h2>
        <p>
          選んだボタンのdata属性をJavaScriptで判定し、選択に合わせて表示を切り替えます。
        </p>
      </div>
    </section>
    <section class="demo">
      <div class="wrap panel">
        <p class="question">JavaScriptで文字を表示するときに使う命令は？</p>
        <div class="quiz-choices">
          <button data-correct="false">style.color</button>
          <button data-correct="true">textContent</button>
          <button data-correct="false">querySelector</button>
        </div>
        <p id="quizMessage" class="calc-result">答えを選んでください。</p>
        <p id="quizExplanation" class="muted"></p>
      </div>
    </section>
    <section data-code-viewer></section>
    <footer>
      <a href="https://github.com/k4nkan/web-js-samples">GitHub</a>
    </footer>
    <script src="./script.js"></script>
    <script src="../../assets/copy-code.js"></script>
  </body>
</html>
