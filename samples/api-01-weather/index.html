<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API 01 Weather</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../assets/sample-common.css" />
  </head>
  <body>
    <a class="top-link" href="../../index.html">Top</a>
    <header><h1>Weather</h1></header>
    <section>
      <div class="wrap">
        <a class="back" href="../../index.html">Back</a>
        <h2>天気カード</h2>
        <p>
          Open-Meteo Forecast
          APIで、選んだ都市の緯度経度を使い、現在の気温と風速を1件のカードに表示します。
        </p>
      </div>
    </section>
    <section class="demo">
      <div class="wrap panel">
        <div class="form">
          <select id="city">
            <option value="35.6895,139.6917,Tokyo">Tokyo</option>
            <option value="51.5072,-0.1276,London">London</option>
            <option value="40.7128,-74.006,New York">New York</option></select
          ><button id="load">取得</button>
        </div>
        <div id="result" class="result"></div>
      </div>
    </section>
    <section data-code-viewer></section>
    <footer>
      <a href="https://github.com/k4nkan/web-js-samples">GitHub</a>
    </footer>
    <script src="./script.js"></script>
    <script src="../../assets/copy-code.js"></script>
  </body>
</html>
