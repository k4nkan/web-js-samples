<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI 08 Character Count</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../../assets/sample-common.css" />
  </head>
  <body>
    <a class="top-link" href="../../index.html">Top</a>
    <header><h1>Character Count</h1></header>
    <section>
      <div class="wrap">
        <a class="back" href="../../index.html">Back</a>
        <h2>文字数カウント</h2>
        <p>
          textareaのinputイベントで文字数を数え、入力中にカウントを更新します。
        </p>
      </div>
    </section>
    <section class="demo">
      <div class="wrap panel">
        <textarea
          id="message"
          rows="5"
          placeholder="入力してください"
        ></textarea>
        <p><span id="count">0</span> 文字</p>
      </div>
    </section>
    <section data-code-viewer></section>
    <footer>
      <a href="https://github.com/k4nkan/web-js-samples">GitHub</a>
    </footer>
    <script src="./script.js"></script>
    <script src="../../assets/copy-code.js"></script>
  </body>
</html>
